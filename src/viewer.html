<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Entry</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        color-scheme: light;
      }
      body {
        position: relative;
      }
      /* Entries are stacked so a new one can paint over the previous one. */
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script src="viewer.js"></script>
  </body>
</html>
